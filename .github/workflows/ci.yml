name: CI/CD Pipeline

on:
  push:
  pull_request:
    branches: [Develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      BOT_INTEGRATION_TESTS: "1"
      DATABASE_URL: "postgresql+asyncpg://spiritvpn_bot:spiritvpn_bot@localhost:5432/spiritvpn_bot"
      BOT_DATABASE_URL: "postgresql+asyncpg://spiritvpn_bot:spiritvpn_bot@localhost:5432/spiritvpn_bot"

    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: spiritvpn_bot
          POSTGRES_PASSWORD: spiritvpn_bot
          POSTGRES_DB: spiritvpn_bot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spiritvpn_bot -d spiritvpn_bot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pipx install poetry==2.2.1

      - name: Cache Poetry virtualenv
        uses: actions/cache@v5
        with:
          path: .venv
          key: poetry-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry install

      - name: Apply database migrations
        run: poetry run alembic upgrade head

      - name: Run tests
        run: poetry run pytest --cov=spiritvpn_bot --cov-report=xml --cov-report=html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov

      - name: Check coverage threshold
        run: |
          COVERAGE=$(poetry run python -c "
          import xml.etree.ElementTree as ET
          print(round(float(ET.parse('coverage.xml').getroot().get('line-rate')) * 100, 1))
          ")
          echo "Current coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "Coverage ${COVERAGE}% is below the 80% threshold"
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pipx install poetry==2.2.1

      - name: Install dependencies
        run: poetry install

      - name: ruff check
        run: poetry run ruff check .

      - name: ruff format --check
        run: poetry run ruff format --check .

      - name: mypy
        run: poetry run mypy -p spiritvpn_bot

  images:
    name: Images
    runs-on: ubuntu-latest
    needs: [test, lint]

    if: github.event_name == 'push' && github.ref == 'refs/heads/Develop'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Resolve image name
        id: image
        run: |
          owner=${GITHUB_REPOSITORY_OWNER,,}
          echo "name=ghcr.io/${owner}/spiritvpn-bot" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      # Образ проверяется запуском, а не фактом успешной сборки. Сборка была
      # зелёной и тогда, когда `alembic` в образе не запускался: poetry
      # прописывает консольным скриптам абсолютный шебанг на интерпретатор
      # своего venv, и сборка в одном каталоге с копированием в другой оставляла
      # шебанг указывать в никуда. Обнаружилось это на управляющем хосте,
      # посреди выкатки. Обе точки входа образа теперь пробуются здесь.
      - name: Smoke-test the published image
        env:
          IMAGE: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          # Миграции: та самая команда, которой инфраструктура их гоняет.
          docker run --rm --entrypoint alembic "$IMAGE" --version
          # Сам бот: без аргументов он печатает подсказку и выходит с кодом 2,
          # что и означает «интерпретатор и пакет на месте».
          status=0
          docker run --rm "$IMAGE" || status=$?
          test "$status" -eq 2

      # Уведомление о факте публикации, а не команда на выкатку: что из него
      # следует, решает инфраструктура. Она закрепляет digest коммитом в
      # desired state, и уже появление этого коммита в main запускает
      # control-deploy — бот приезжает на тот же хост, что и бэкенд.
      #
      # Передаётся digest, а не тег: тег можно переставить, digest — нет, и
      # только он делает выкатку воспроизводимой.
      - name: Report the published image to the infrastructure
        env:
          GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          IMAGE_REPOSITORY: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # Пустой digest означает, что сборка не отработала. Отправлять
          # неполное событие нельзя: принимающая сторона запишет его в
          # desired state.
          test -n "$IMAGE_DIGEST"
          # jq сам экранирует значения; сборка JSON конкатенацией строк
          # ломается на первом же неожиданном символе.
          jq -n \
            --arg environment develop \
            --arg source_git_sha "$GITHUB_SHA" \
            --arg repository "$IMAGE_REPOSITORY" \
            --arg digest "$IMAGE_DIGEST" \
            '{event_type: "bot-release", client_payload: {
                environment: $environment,
                source_git_sha: $source_git_sha,
                image: {repository: $repository, digest: $digest}}}' \
            | gh api repos/SpiritTechDevelopment/Infrastructure/dispatches \
                --method POST --input -
