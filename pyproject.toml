[project]
name = "spiritvpn-bot"
version = "0.1.0"
description = "Telegram bot + mini app that sells access to SpiritVPN"
authors = [
    { name = "Roman Ryabinkin" },
]
readme = "README.md"
requires-python = ">=3.11,<3.14"

[tool.poetry]
# "spiritvpn" — сгенерированные protoc grpc-стабы (proto/, make proto-gen).
# Отдельный top-level пакет, а не подпакет spiritvpn_bot: так генератор
# отдаёт абсолютные импорты вида `from spiritvpn.customer.v1 import ...`
# без постобработки.
packages = [
    { include = "spiritvpn_bot", from = "src" },
    { include = "spiritvpn", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
aiogram = "^3.15"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.32" }
pydantic-settings = "^2.6"
sqlalchemy = { extras = ["asyncio"], version = "^2.0" }
asyncpg = "^0.30"
alembic = "^1.14"
grpcio = "^1.68"
grpcio-tools = "^1.68"
structlog = "^24.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
pytest-cov = "^6.0"
ruff = "^0.8"
mypy = "^1.13"
types-grpcio = "^1.83.0.20260730"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# src/spiritvpn/ — сгенерированный protoc код (make proto-gen), не наш стиль.
extend-exclude = ["src/spiritvpn/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = ["tests", "src/spiritvpn/"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
# Сгенерированный protoc код (make proto-gen) не типизирован по нашим правилам.
module = ["spiritvpn.*"]
ignore_errors = true
