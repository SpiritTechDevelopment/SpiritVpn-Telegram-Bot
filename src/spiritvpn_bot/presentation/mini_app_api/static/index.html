<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SpiritVPN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500&display=swap"
    />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafafa;
        --card-bg: #ffffff;
        --text: #111111;
        --hint: #7a7a7a;
        --accent: #c9702e;
        --border: rgba(0, 0, 0, 0.08);
        --code-bg: rgba(0, 0, 0, 0.03);
        --card-shadow: 0 24px 48px -22px rgba(0, 0, 0, 0.1);
        --button-shadow:
          0 8px 16px -8px color-mix(in srgb, var(--accent) 40%, transparent),
          0 18px 36px -18px rgba(0, 0, 0, 0.16);
        --buy-shadow:
          0 6px 14px -6px color-mix(in srgb, var(--accent) 40%, transparent),
          0 12px 26px -12px rgba(0, 0, 0, 0.16);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d0d0d;
          --card-bg: #161616;
          --text: #ffffff;
          --hint: #9c9c9c;
          --accent: #e8935a;
          --border: rgba(255, 255, 255, 0.09);
          --code-bg: rgba(255, 255, 255, 0.05);
          --card-shadow: 0 24px 56px -20px rgba(0, 0, 0, 0.55);
          --button-shadow:
            0 8px 18px -8px color-mix(in srgb, var(--accent) 55%, transparent),
            0 18px 40px -16px rgba(0, 0, 0, 0.55);
          --buy-shadow:
            0 6px 14px -6px color-mix(in srgb, var(--accent) 55%, transparent),
            0 12px 26px -12px rgba(0, 0, 0, 0.55);
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 1.6rem 1.25rem 2.5rem;
        background: var(--bg);
        color: var(--text);
        font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        gap: 1.6rem;
      }
      .wordmark {
        font-family: "Instrument Serif", serif;
        font-style: italic;
        font-size: 1.7rem;
        line-height: 1.1;
      }
      .subtitle {
        font-size: 0.82rem;
        color: var(--hint);
        margin: 0.1rem 0 0;
      }
      .kicker {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin: 0 0 0.6rem;
      }
      .kicker::before {
        content: "";
        width: 10px;
        height: 2px;
        border-radius: 1px;
        background: var(--accent);
        flex-shrink: 0;
      }
      .kicker span {
        font-size: 0.69rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--hint);
      }
      .card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 1.1rem;
        box-shadow: var(--card-shadow);
      }
      .card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 0.6rem;
      }
      .card-header .kicker {
        margin: 0;
      }
      #days-left-chip {
        font-size: 0.68rem;
        font-weight: 600;
        color: var(--text);
        background: var(--code-bg);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 0.25rem 0.6rem;
      }
      #status-line {
        font-size: 1rem;
        font-weight: 600;
        margin: 0 0 0.6rem;
      }
      #health-bar {
        display: flex;
        gap: 4px;
        margin-bottom: 1rem;
      }
      #health-bar span {
        flex-grow: 1;
        height: 5px;
        border-radius: 3px;
      }
      #servers {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      .server {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        flex-wrap: wrap;
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .dot.ready {
        background: #2f9c5f;
      }
      .dot.pending {
        background: #c9973f;
      }
      .dot.blocked,
      .dot.failed {
        background: #b8503f;
      }
      .debug-tag {
        margin-left: auto;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 0.66rem;
        background: var(--code-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 3px 7px;
      }
      .debug-tag .kind {
        color: var(--accent);
      }
      .debug-tag .sni {
        color: var(--hint);
      }
      #toggle-servers {
        align-self: flex-start;
        border: none;
        background: transparent;
        color: var(--hint);
        font-family: inherit;
        font-size: 0.8rem;
        font-weight: 600;
        padding: 0.2rem 0;
        margin-top: 0.75rem;
        cursor: pointer;
      }
      #toggle-servers:hover {
        opacity: 0.7;
      }
      .empty-state {
        color: var(--hint);
        font-size: 0.92rem;
        padding: 0.5rem 0;
      }
      #plans {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      .plan {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 0.9rem 1rem;
        box-shadow: var(--card-shadow);
      }
      .plan-info {
        flex-grow: 1;
      }
      .plan-title {
        font-weight: 600;
        font-size: 0.95rem;
      }
      .plan-meta {
        color: var(--hint);
        font-size: 0.8rem;
        margin-top: 0.2rem;
      }
      button {
        cursor: pointer;
        font-family: inherit;
      }
      .btn-primary {
        width: 100%;
        height: 48px;
        border: none;
        border-radius: 14px;
        background: var(--text);
        color: var(--bg);
        font-size: 0.88rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        box-shadow: var(--button-shadow);
        transition: opacity 0.15s;
        margin-top: 1.1rem;
      }
      .btn-primary:hover {
        opacity: 0.86;
      }
      .btn-primary svg {
        stroke: var(--accent);
      }
      .btn-buy {
        flex-shrink: 0;
        width: 44px;
        height: 44px;
        border: none;
        border-radius: 14px;
        background: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: var(--buy-shadow);
        transition: opacity 0.15s;
      }
      .btn-buy:hover {
        opacity: 0.86;
      }
      .btn-buy svg {
        stroke: var(--accent);
      }
      #toast {
        position: fixed;
        left: 1rem;
        right: 1rem;
        bottom: 1rem;
        background: var(--text);
        color: var(--bg);
        padding: 0.7rem 1rem;
        border-radius: 10px;
        font-size: 0.88rem;
        text-align: center;
        opacity: 0;
        transform: translateY(8px);
        transition:
          opacity 0.2s,
          transform 0.2s;
        pointer-events: none;
      }
      #toast.visible {
        opacity: 1;
        transform: translateY(0);
      }
    </style>
  </head>
  <body>
    <div>
      <div class="wordmark">SpiritVPN</div>
      <p class="subtitle">Управление подпиской</p>
    </div>

    <section class="card">
      <div class="card-header">
        <p class="kicker"><span>Статус</span></p>
        <span id="days-left-chip" style="display: none"></span>
      </div>
      <p id="status-line">Загрузка…</p>
      <div id="health-bar"></div>
      <div id="servers"></div>
      <button id="toggle-servers" style="display: none"></button>
      <button id="copy-btn" class="btn-primary" style="display: none">
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"
          ></path>
          <path
            d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"
          ></path>
        </svg>
        Скопировать ссылку подписки
      </button>
    </section>

    <section>
      <p class="kicker"><span>Тарифы</span></p>
      <p class="empty-state" id="plans-empty" style="display: none">
        Платные тарифы скоро появятся.
      </p>
      <div id="plans"></div>
    </section>

    <div id="toast"></div>

    <script>
      const tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();

      // DEBUG: показывает kind (FREEDOM/BRIDGE) и SNI рядом с каждым
      // сервером — для разбора, какой регион на каком kind/ноде. Убрать
      // вместе с debug_sni в LinkStatusOut/main.py, когда разбор закончится.
      const DEBUG_SHOW_LINK_DETAILS = true;
      const COLLAPSED_SERVER_LIMIT = 4;

      const STATE_LABEL = {
        READY: "готов",
        PENDING: "активируется",
        BLOCKED: "заблокирован",
        FAILED: "ошибка",
      };

      let allLinks = [];
      let serversExpanded = false;

      function showToast(text) {
        const toast = document.getElementById("toast");
        toast.textContent = text;
        toast.classList.add("visible");
        setTimeout(() => toast.classList.remove("visible"), 2000);
      }

      async function callApi(path) {
        const res = await fetch(path, {
          headers: { "X-Telegram-Init-Data": tg.initData },
        });
        if (!res.ok) {
          throw new Error(`${path} -> ${res.status}`);
        }
        return res.json();
      }

      function formatBytes(bytes) {
        const gib = bytes / 1024 ** 3;
        return Number.isInteger(gib) ? `${gib} ГБ` : `${gib.toFixed(1)} ГБ`;
      }

      function formatPrice(amountMinor, currency) {
        const amount = (amountMinor / 100).toLocaleString("ru-RU");
        return `${amount} ${currency}`;
      }

      function buildServerRow(link, index) {
        const row = document.createElement("div");
        row.className = "server";

        const dot = document.createElement("span");
        dot.className = `dot ${link.state.toLowerCase()}`;
        row.appendChild(dot);

        const name = document.createElement("span");
        const linkName = link.label ?? `Сервер ${index + 1}`;
        name.textContent = `${linkName} — ${STATE_LABEL[link.state] ?? link.state}`;
        row.appendChild(name);

        if (DEBUG_SHOW_LINK_DETAILS) {
          const tag = document.createElement("span");
          tag.className = "debug-tag";
          const kind = document.createElement("span");
          kind.className = "kind";
          kind.textContent = link.kind;
          tag.appendChild(kind);
          if (link.debug_sni) {
            const sni = document.createElement("span");
            sni.className = "sni";
            sni.textContent = `, sni=${link.debug_sni}`;
            tag.appendChild(sni);
          }
          row.appendChild(tag);
        }

        return row;
      }

      function renderHealthBar() {
        const barEl = document.getElementById("health-bar");
        barEl.innerHTML = "";
        for (const link of allLinks) {
          const segment = document.createElement("span");
          const color = link.state === "READY" ? "#2f9c5f" : "#b8503f";
          segment.style.background = color;
          segment.style.boxShadow = `0 0 8px ${color}77`;
          barEl.appendChild(segment);
        }
      }

      function renderServers() {
        const serversEl = document.getElementById("servers");
        const toggleBtn = document.getElementById("toggle-servers");
        serversEl.innerHTML = "";

        const visible = serversExpanded
          ? allLinks
          : allLinks.slice(0, COLLAPSED_SERVER_LIMIT);
        visible.forEach((link, index) => serversEl.appendChild(buildServerRow(link, index)));

        if (allLinks.length > COLLAPSED_SERVER_LIMIT) {
          toggleBtn.style.display = "block";
          toggleBtn.textContent = serversExpanded
            ? "Свернуть"
            : `Показать ещё ${allLinks.length - COLLAPSED_SERVER_LIMIT}`;
        } else {
          toggleBtn.style.display = "none";
        }
      }

      document.getElementById("toggle-servers").onclick = () => {
        serversExpanded = !serversExpanded;
        renderServers();
      };

      async function loadDaysLeft() {
        try {
          const { days_left } = await callApi("/api/me/subscription-status");
          if (days_left === null) {
            return;
          }
          const chip = document.getElementById("days-left-chip");
          chip.textContent = `${days_left} дней осталось`;
          chip.style.display = "inline-block";
        } catch (err) {
          console.error(err);
        }
      }

      async function loadSubscriptionStatus() {
        const statusEl = document.getElementById("status-line");
        const copyBtn = document.getElementById("copy-btn");

        allLinks = await callApi("/api/me/links");

        if (allLinks.length === 0) {
          statusEl.textContent = "Активной подписки нет — выберите тариф ниже.";
          return;
        }

        const ready = allLinks.filter((l) => l.state === "READY").length;
        statusEl.textContent = `${ready} из ${allLinks.length} серверов активны`;
        renderHealthBar();
        renderServers();

        const { url } = await callApi("/api/me/subscription-url");
        copyBtn.style.display = "flex";
        copyBtn.onclick = async () => {
          await navigator.clipboard.writeText(url);
          tg.HapticFeedback?.notificationOccurred("success");
          const label = copyBtn.lastChild;
          label.textContent = "Скопировано";
          setTimeout(() => {
            label.textContent = "Скопировать ссылку подписки";
          }, 1500);
        };
      }

      async function loadPlans() {
        const plansEl = document.getElementById("plans");
        const emptyEl = document.getElementById("plans-empty");

        const plans = await fetch("/api/plans").then((r) => r.json());

        if (plans.length === 0) {
          emptyEl.style.display = "block";
          return;
        }

        for (const plan of plans) {
          const row = document.createElement("div");
          row.className = "plan";

          const info = document.createElement("div");
          info.className = "plan-info";
          const title = document.createElement("div");
          title.className = "plan-title";
          title.textContent = plan.title;
          const meta = document.createElement("div");
          meta.className = "plan-meta";
          const quotaText = plan.display_as_unlimited ? "Безлимит" : formatBytes(plan.quota_bytes);
          meta.textContent = `${plan.duration_days} дней · ${quotaText} · ${formatPrice(plan.price_amount_minor, plan.price_currency)}`;
          info.append(title, meta);

          const buyBtn = document.createElement("button");
          buyBtn.className = "btn-buy";
          buyBtn.setAttribute("aria-label", "Купить");
          buyBtn.innerHTML =
            '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>';
          buyBtn.onclick = () => showToast("Оплата скоро будет доступна");

          row.append(info, buyBtn);
          plansEl.appendChild(row);
        }
      }

      async function main() {
        try {
          await loadSubscriptionStatus();
        } catch (err) {
          document.getElementById("status-line").textContent = "Не удалось загрузить статус подписки.";
          console.error(err);
        }

        try {
          await loadDaysLeft();
        } catch (err) {
          console.error(err);
        }

        try {
          await loadPlans();
        } catch (err) {
          console.error(err);
        }
      }

      main();
    </script>
  </body>
</html>
