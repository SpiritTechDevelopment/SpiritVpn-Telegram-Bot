<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SpiritVPN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d0d0d;
        --card-bg: #161616;
        --text: #ffffff;
        --hint: #9c9c9c;
        --accent: #e8935a;
        --border: rgba(255, 255, 255, 0.09);
        --code-bg: rgba(255, 255, 255, 0.05);
        --card-shadow: 0 24px 56px -20px rgba(0, 0, 0, 0.55);
        --button-shadow: 0 8px 20px -10px color-mix(in srgb, var(--accent) 30%, transparent);
        --buy-shadow:
          0 8px 20px -10px color-mix(in srgb, var(--accent) 40%, transparent),
          inset 0 1px 0 rgba(255, 255, 255, 0.1);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 1.6rem 1.25rem 2.5rem;
        background: var(--bg);
        color: var(--text);
        font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        gap: 1.6rem;
      }
      .page-heading {
        font-family: "Manrope", sans-serif;
        font-weight: 800;
        font-size: 1.9rem;
        line-height: 1.05;
        letter-spacing: -0.02em;
        margin: 0;
        text-wrap: balance;
      }
      .kicker {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin: 0 0 0.6rem;
      }
      .kicker::before {
        content: "";
        width: 10px;
        height: 2px;
        border-radius: 1px;
        background: var(--accent);
        flex-shrink: 0;
      }
      .kicker span {
        font-size: 0.69rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--hint);
      }
      .card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 1.1rem;
        box-shadow: var(--card-shadow);
      }
      .card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 0.6rem;
      }
      .card-header .kicker {
        margin: 0;
      }
      #days-left-chip {
        font-size: 0.68rem;
        font-weight: 600;
        color: var(--text);
        background: var(--code-bg);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 0.25rem 0.6rem;
      }
      @keyframes shimmer-sweep {
        0% {
          background-position: -150% 0;
        }
        100% {
          background-position: 150% 0;
        }
      }
      .skel {
        display: block;
        background-color: rgba(255, 255, 255, 0.06);
        background-image: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.06) 0%,
          rgba(255, 255, 255, 0.06) 40%,
          rgba(255, 255, 255, 0.15) 50%,
          rgba(255, 255, 255, 0.06) 60%,
          rgba(255, 255, 255, 0.06) 100%
        );
        background-size: 200% 100%;
        animation: shimmer-sweep 2.2s ease-in-out infinite;
        border-radius: 4px;
      }
      @media (prefers-reduced-motion: reduce) {
        .skel {
          animation: none;
        }
      }
      .status-skeleton,
      .plans-skeleton {
        display: flex;
        flex-direction: column;
      }
      #status-line {
        font-size: 1rem;
        font-weight: 600;
        margin: 0 0 0.6rem;
      }
      .status-empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 0.75rem;
        padding: 1.25rem 0.75rem 0.5rem;
      }
      .status-empty svg {
        stroke: var(--hint);
      }
      .status-empty-text {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }
      #status-empty-title {
        font-size: 1rem;
        font-weight: 600;
      }
      #status-empty-subtitle {
        font-size: 0.82rem;
        color: var(--hint);
        max-width: 260px;
      }
      #health-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 1rem;
      }
      #health-bar {
        display: flex;
        gap: 3px;
        flex-grow: 1;
      }
      #health-bar span {
        flex-grow: 1;
        height: 10px;
        border-radius: 5px;
      }
      #health-fraction {
        flex-shrink: 0;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 0.8rem;
        font-weight: 600;
      }
      #servers {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      .server {
        display: flex;
        align-items: center;
        gap: 0.6rem;
      }
      .server-info {
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .server-detail {
        font-size: 0.78rem;
        color: var(--hint);
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .dot.ready {
        background: #2f9c5f;
      }
      .dot.pending {
        background: #c9973f;
      }
      .dot.blocked,
      .dot.failed {
        background: #b8503f;
      }
      .flag {
        display: flex;
        width: 20px;
        height: 14px;
        border-radius: 2px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.18);
        flex-shrink: 0;
      }
      .flag span {
        display: block;
      }
      #toggle-servers {
        align-self: flex-start;
        border: none;
        background: transparent;
        color: var(--hint);
        font-family: inherit;
        font-size: 0.8rem;
        font-weight: 600;
        padding: 0.2rem 0;
        margin-top: 0.75rem;
        cursor: pointer;
      }
      #toggle-servers:hover {
        opacity: 0.7;
      }
      .empty-state {
        color: var(--hint);
        font-size: 0.92rem;
        padding: 0.5rem 0;
      }
      #plans {
        display: flex;
        flex-direction: column;
        gap: 0;
      }
      .plan {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.75rem 0;
      }
      .plan + .plan {
        border-top: 1px solid var(--border);
      }
      .plan-info {
        flex-grow: 1;
      }
      .plan-title {
        font-weight: 600;
        font-size: 0.95rem;
      }
      .plan-meta {
        color: var(--hint);
        font-size: 0.8rem;
        margin-top: 0.2rem;
      }
      button {
        cursor: pointer;
        font-family: inherit;
        padding: 0;
      }
      @keyframes success-pop {
        0% {
          transform: scale(0.97);
        }
        45% {
          transform: scale(1.035);
        }
        100% {
          transform: scale(1);
        }
      }
      @keyframes check-draw {
        from {
          stroke-dashoffset: 24;
        }
        to {
          stroke-dashoffset: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .btn-primary.copied {
          animation: none;
        }
        .btn-primary.copied .check-path {
          animation: none;
          stroke-dashoffset: 0;
        }
      }
      .btn-primary {
        width: 100%;
        height: 48px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(6px);
        color: var(--text);
        font-size: 0.88rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        box-shadow: var(--button-shadow);
        transition:
          transform 0.15s,
          background 0.25s,
          border-color 0.25s,
          color 0.25s,
          box-shadow 0.25s;
        margin-top: 1.1rem;
      }
      .btn-primary:active {
        transform: scale(0.98);
        background: rgba(255, 255, 255, 0.14);
      }
      .btn-primary svg {
        stroke: var(--accent);
      }
      .btn-primary .icon-check {
        display: none;
      }
      .btn-primary.copied {
        animation: success-pop 0.45s ease-out;
        background: rgba(250, 244, 237, 0.9);
        border-color: rgba(255, 255, 255, 0.35);
        color: #211c17;
        box-shadow:
          0 8px 20px -10px color-mix(in srgb, var(--accent) 40%, transparent),
          inset 0 1px 0 rgba(255, 255, 255, 0.4);
      }
      .btn-primary.copied .icon-link {
        display: none;
      }
      .btn-primary.copied .icon-check {
        display: block;
      }
      .btn-primary.copied .check-path {
        stroke-dasharray: 24;
        animation: check-draw 0.3s ease-out 0.08s forwards;
      }
      .btn-buy {
        flex-shrink: 0;
        width: 44px;
        height: 44px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.16);
        backdrop-filter: blur(6px);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: var(--buy-shadow);
        transition:
          transform 0.15s,
          background 0.15s,
          box-shadow 0.15s;
      }
      .btn-buy:active {
        transform: scale(0.93);
        background: rgba(255, 255, 255, 0.16);
        box-shadow:
          0 4px 10px -6px color-mix(in srgb, var(--accent) 50%, transparent),
          inset 0 1px 0 rgba(255, 255, 255, 0.14);
      }
      .btn-buy svg {
        stroke: var(--accent);
      }
      #toast {
        position: fixed;
        left: 1rem;
        right: 1rem;
        bottom: 1rem;
        background: var(--text);
        color: var(--bg);
        padding: 0.7rem 1rem;
        border-radius: 10px;
        font-size: 0.88rem;
        text-align: center;
        opacity: 0;
        transform: translateY(8px);
        transition:
          opacity 0.2s,
          transform 0.2s;
        pointer-events: none;
      }
      #toast.visible {
        opacity: 1;
        transform: translateY(0);
      }
    </style>
  </head>
  <body>
    <h1 class="page-heading">Управление подпиской</h1>

    <section class="card">
      <div class="card-header">
        <p class="kicker"><span>Статус</span></p>
        <span id="days-left-chip" style="display: none"></span>
        <span
          id="days-left-skeleton"
          class="skel"
          style="width: 88px; height: 22px; border-radius: 999px"
        ></span>
      </div>

      <div id="status-skeleton" class="status-skeleton">
        <span class="skel" style="width: 65%; height: 16px; margin-bottom: 16px"></span>
        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 20px">
          <div style="display: flex; gap: 3px; flex-grow: 1">
            <span class="skel" style="flex-grow: 1; height: 10px; border-radius: 5px"></span>
            <span class="skel" style="flex-grow: 1; height: 10px; border-radius: 5px"></span>
            <span class="skel" style="flex-grow: 1; height: 10px; border-radius: 5px"></span>
          </div>
          <span class="skel" style="width: 26px; height: 14px"></span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 14px; margin-bottom: 17.6px">
          <div style="display: flex; align-items: center; gap: 9.6px">
            <span class="skel" style="width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0"></span>
            <span class="skel" style="width: 20px; height: 14px; border-radius: 2px; flex-shrink: 0"></span>
            <div style="display: flex; flex-direction: column; gap: 5px">
              <span class="skel" style="width: 96px; height: 13px"></span>
              <span class="skel" style="width: 64px; height: 11px"></span>
            </div>
          </div>
          <div style="display: flex; align-items: center; gap: 9.6px">
            <span class="skel" style="width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0"></span>
            <span class="skel" style="width: 20px; height: 14px; border-radius: 2px; flex-shrink: 0"></span>
            <div style="display: flex; flex-direction: column; gap: 5px">
              <span class="skel" style="width: 82px; height: 13px"></span>
              <span class="skel" style="width: 58px; height: 11px"></span>
            </div>
          </div>
          <div style="display: flex; align-items: center; gap: 9.6px">
            <span class="skel" style="width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0"></span>
            <span class="skel" style="width: 20px; height: 14px; border-radius: 2px; flex-shrink: 0"></span>
            <div style="display: flex; flex-direction: column; gap: 5px">
              <span class="skel" style="width: 70px; height: 13px"></span>
              <span class="skel" style="width: 46px; height: 11px"></span>
            </div>
          </div>
        </div>
        <span class="skel" style="width: 100%; height: 48px; border-radius: 14px"></span>
      </div>

      <p id="status-line" style="display: none"></p>
      <div id="health-row" style="display: none">
        <div id="health-bar"></div>
        <span id="health-fraction"></span>
      </div>
      <div id="servers" style="display: none"></div>
      <button id="toggle-servers" style="display: none"></button>
      <button id="copy-btn" class="btn-primary" style="display: none">
        <svg
          class="icon-link"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"
          ></path>
          <path
            d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"
          ></path>
        </svg>
        <svg
          class="icon-check"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path class="check-path" d="M20 6 9 17l-5-5"></path>
        </svg>
        <span class="copy-label">Скопировать ссылку подписки</span>
      </button>
      <div id="status-empty" class="status-empty" style="display: none">
        <svg
          width="40"
          height="40"
          viewBox="0 0 24 24"
          fill="none"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"></path>
        </svg>
        <div class="status-empty-text">
          <span id="status-empty-title"></span>
          <span id="status-empty-subtitle"></span>
        </div>
      </div>
    </section>

    <section class="card">
      <p class="kicker"><span id="tariffs-kicker-label">Тарифы</span></p>

      <div id="plans-skeleton" class="plans-skeleton">
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 0">
          <div style="display: flex; flex-direction: column; gap: 6px; flex-grow: 1">
            <span class="skel" style="width: 88px; height: 14px"></span>
            <span class="skel" style="width: 56px; height: 12px"></span>
          </div>
          <span class="skel" style="width: 44px; height: 44px; border-radius: 14px; flex-shrink: 0"></span>
        </div>
        <div
          style="display: flex; align-items: center; gap: 12px; padding: 12px 0 0; border-top: 1px solid var(--border)"
        >
          <div style="display: flex; flex-direction: column; gap: 6px; flex-grow: 1">
            <span class="skel" style="width: 96px; height: 14px"></span>
            <span class="skel" style="width: 56px; height: 12px"></span>
          </div>
          <span class="skel" style="width: 44px; height: 44px; border-radius: 14px; flex-shrink: 0"></span>
        </div>
      </div>

      <p class="empty-state" id="plans-empty" style="display: none">
        Платные тарифы скоро появятся.
      </p>
      <div id="plans" style="display: none"></div>
    </section>

    <div id="toast"></div>

    <script>
      const tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();
      tg.setHeaderColor?.("#0d0d0d");
      tg.setBackgroundColor?.("#0d0d0d");

      const COLLAPSED_SERVER_LIMIT = 4;

      const STATE_COLOR = {
        READY: "#2f9c5f",
        PENDING: "#c9973f",
        BLOCKED: "#b8503f",
        FAILED: "#b8503f",
      };

      const BUY_ICON_SVG =
        '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>';
      const RENEW_ICON_SVG =
        '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path><path d="M3 21v-5h5"></path></svg>';

      const COUNTRIES = {
        NL: {
          name: "Netherlands",
          flag: { dir: "column", stripes: [["#AE1C28", 1], ["#FFFFFF", 1], ["#21468B", 1]] },
        },
        DE: {
          name: "Germany",
          flag: { dir: "column", stripes: [["#000000", 1], ["#DD0000", 1], ["#FFCE00", 1]] },
        },
        LV: {
          name: "Latvia",
          flag: { dir: "column", stripes: [["#9E1B32", 2], ["#FFFFFF", 1], ["#9E1B32", 2]] },
        },
        RO: {
          name: "Romania",
          flag: { dir: "row", stripes: [["#002B7F", 1], ["#FCD116", 1], ["#CE1126", 1]] },
        },
        RU: {
          name: "Russia",
          flag: { dir: "column", stripes: [["#FFFFFF", 1], ["#0039A6", 1], ["#D52B1E", 1]] },
        },
      };

      const COUNTRY_CODE_BY_LEGACY_NAME = {
        amsterdam: "NL",
        frankfurt: "DE",
        riga: "LV",
        romania: "RO",
        russia: "RU",
      };

      const COUNTRY_CODE_RE = /^[A-Z]{2}$/;

      function splitCountryCode(side) {
        const [first, ...rest] = side.split(" ");
        if (COUNTRY_CODE_RE.test(first) && COUNTRIES[first]) {
          return { code: first, rest: rest.join(" ") || side };
        }
        return { code: null, rest: side };
      }

      function countryInfoForSide(rawSide) {
        const { code, rest } = splitCountryCode(rawSide);
        const resolvedCode = code ?? COUNTRY_CODE_BY_LEGACY_NAME[rawSide.toLowerCase()];
        const country = resolvedCode ? COUNTRIES[resolvedCode] : undefined;
        return {
          flag: country?.flag ?? null,
          name: country?.name ?? rest,
          detail: country && rest !== country.name ? rest : null,
        };
      }

      function resolveLink(label) {
        if (!label) {
          return { flagDef: null, displayLabel: null, detailLabel: null };
        }
        const infos = label.split("→").map((side) => countryInfoForSide(side.trim()));
        const detailLabel = infos.some((info) => info.detail)
          ? infos.map((info) => info.detail ?? info.name).join(" → ")
          : null;
        return {
          flagDef: infos[0].flag,
          displayLabel: infos.map((info) => info.name).join(" → "),
          detailLabel,
        };
      }

      function buildFlagIcon(flagDef) {
        if (!flagDef) {
          return null;
        }
        const flag = document.createElement("span");
        flag.className = "flag";
        flag.style.flexDirection = flagDef.dir;
        for (const [color, weight] of flagDef.stripes) {
          const stripe = document.createElement("span");
          stripe.style.background = color;
          stripe.style.flexGrow = String(weight);
          flag.appendChild(stripe);
        }
        return flag;
      }

      let allLinks = [];
      let serversExpanded = false;

      let tariffsMode = "buy";

      function showToast(text) {
        const toast = document.getElementById("toast");
        toast.textContent = text;
        toast.classList.add("visible");
        setTimeout(() => toast.classList.remove("visible"), 2000);
      }

      async function callApi(path) {
        const res = await fetch(path, {
          headers: { "X-Telegram-Init-Data": tg.initData },
        });
        if (!res.ok) {
          throw new Error(`${path} -> ${res.status}`);
        }
        return res.json();
      }

      function formatBytes(bytes) {
        const gib = bytes / 1024 ** 3;
        return Number.isInteger(gib) ? `${gib} ГБ` : `${gib.toFixed(1)} ГБ`;
      }

      function formatPrice(amountMinor, currency) {
        const amount = (amountMinor / 100).toLocaleString("ru-RU");
        return `${amount} ${currency}`;
      }

      function buildServerRow(link, index) {
        const row = document.createElement("div");
        row.className = "server";

        const dot = document.createElement("span");
        dot.className = `dot ${link.state.toLowerCase()}`;
        row.appendChild(dot);

        const { flagDef, displayLabel, detailLabel } = resolveLink(link.label);
        const flagIcon = buildFlagIcon(flagDef);
        if (flagIcon) {
          row.appendChild(flagIcon);
        }

        const info = document.createElement("div");
        info.className = "server-info";

        const name = document.createElement("span");
        name.textContent = displayLabel ?? `Сервер ${index + 1}`;
        info.appendChild(name);

        if (detailLabel) {
          const detail = document.createElement("span");
          detail.className = "server-detail";
          detail.textContent = detailLabel;
          info.appendChild(detail);
        }

        row.appendChild(info);

        return row;
      }

      function renderHealthBar() {
        const barEl = document.getElementById("health-bar");
        const fractionEl = document.getElementById("health-fraction");
        barEl.innerHTML = "";
        for (const link of allLinks) {
          const color = STATE_COLOR[link.state] ?? STATE_COLOR.FAILED;
          const segment = document.createElement("span");
          segment.style.background = color;
          segment.style.boxShadow = `0 0 10px ${color}66`;
          barEl.appendChild(segment);
        }
        const readyCount = allLinks.filter((l) => l.state === "READY").length;
        fractionEl.textContent = `${readyCount}/${allLinks.length}`;
      }

      function renderServers() {
        const serversEl = document.getElementById("servers");
        const toggleBtn = document.getElementById("toggle-servers");
        serversEl.innerHTML = "";

        const visible = serversExpanded
          ? allLinks
          : allLinks.slice(0, COLLAPSED_SERVER_LIMIT);
        visible.forEach((link, index) => serversEl.appendChild(buildServerRow(link, index)));

        if (allLinks.length > COLLAPSED_SERVER_LIMIT) {
          toggleBtn.style.display = "block";
          toggleBtn.textContent = serversExpanded
            ? "Свернуть"
            : `Показать ещё ${allLinks.length - COLLAPSED_SERVER_LIMIT}`;
        } else {
          toggleBtn.style.display = "none";
        }
      }

      document.getElementById("toggle-servers").onclick = () => {
        serversExpanded = !serversExpanded;
        renderServers();
      };

      function hideSkeleton() {
        document.getElementById("status-skeleton").style.display = "none";
        document.getElementById("days-left-skeleton").style.display = "none";
        document.getElementById("plans-skeleton").style.display = "none";
        document.getElementById("plans").style.display = "flex";
      }

      function showSkeleton() {
        document.getElementById("status-skeleton").style.display = "flex";
        document.getElementById("days-left-skeleton").style.display = "block";
        document.getElementById("plans-skeleton").style.display = "flex";
        document.getElementById("days-left-chip").style.display = "none";
        document.getElementById("status-line").style.display = "none";
        document.getElementById("health-row").style.display = "none";
        document.getElementById("servers").style.display = "none";
        document.getElementById("toggle-servers").style.display = "none";
        document.getElementById("copy-btn").style.display = "none";
        document.getElementById("status-empty").style.display = "none";
        document.getElementById("plans").style.display = "none";
        document.getElementById("plans-empty").style.display = "none";
      }

      function renderDaysLeft(daysLeft) {
        if (daysLeft === null) {
          return;
        }
        const chip = document.getElementById("days-left-chip");
        chip.textContent = `${daysLeft} дней осталось`;
        chip.style.display = "inline-block";
      }

      function renderSubscriptionStatus(links, subscriptionUrl) {
        allLinks = links;

        const statusEl = document.getElementById("status-line");
        const healthRowEl = document.getElementById("health-row");
        const serversEl = document.getElementById("servers");
        const toggleBtn = document.getElementById("toggle-servers");
        const copyBtn = document.getElementById("copy-btn");
        const emptyEl = document.getElementById("status-empty");
        const emptyTitleEl = document.getElementById("status-empty-title");
        const emptySubtitleEl = document.getElementById("status-empty-subtitle");
        const tariffsKickerEl = document.getElementById("tariffs-kicker-label");

        const hasEverHadAccess = allLinks.length > 0;
        const hasActiveOrPending = allLinks.some(
          (l) => l.state === "READY" || l.state === "PENDING",
        );

        tariffsMode = hasEverHadAccess ? "renew" : "buy";
        tariffsKickerEl.textContent = tariffsMode === "renew" ? "Тарифы — продление" : "Тарифы";

        if (!hasActiveOrPending) {
          statusEl.style.display = "none";
          healthRowEl.style.display = "none";
          serversEl.style.display = "none";
          toggleBtn.style.display = "none";
          copyBtn.style.display = "none";
          emptyEl.style.display = "flex";
          emptyTitleEl.textContent = hasEverHadAccess
            ? "Подписка закончилась"
            : "Активной подписки нет";
          emptySubtitleEl.textContent = hasEverHadAccess
            ? "Продлите тариф ниже, чтобы восстановить доступ"
            : "Оформите тариф ниже, чтобы получить доступ к серверам";
          return;
        }

        emptyEl.style.display = "none";
        statusEl.style.display = "block";
        serversEl.style.display = "flex";

        const ready = allLinks.filter((l) => l.state === "READY").length;
        statusEl.textContent =
          ready === allLinks.length
            ? "Все серверы активны"
            : ready === 0
              ? "Серверы активируются"
              : "Не все серверы активны";
        healthRowEl.style.display = "flex";
        renderHealthBar();
        renderServers();

        if (subscriptionUrl) {
          copyBtn.style.display = "flex";
          copyBtn.onclick = async () => {
            await navigator.clipboard.writeText(subscriptionUrl);
            tg.HapticFeedback?.notificationOccurred("success");
            const label = copyBtn.querySelector(".copy-label");
            copyBtn.classList.add("copied");
            label.textContent = "Скопировано";
            setTimeout(() => {
              copyBtn.classList.remove("copied");
              label.textContent = "Скопировать ссылку подписки";
            }, 1500);
          };
        }
      }

      function renderSubscriptionError() {
        const statusEl = document.getElementById("status-line");
        statusEl.style.display = "block";
        statusEl.textContent = "Не удалось загрузить статус подписки.";
        document.getElementById("status-empty").style.display = "none";
      }

      function renderPlans(plans) {
        const plansEl = document.getElementById("plans");
        const emptyEl = document.getElementById("plans-empty");

        plansEl.innerHTML = "";
        emptyEl.style.display = "none";

        if (plans.length === 0) {
          emptyEl.style.display = "block";
          return;
        }

        const buyLabel = tariffsMode === "renew" ? "Продлить" : "Купить";
        const buyIcon = tariffsMode === "renew" ? RENEW_ICON_SVG : BUY_ICON_SVG;
        const toastText =
          tariffsMode === "renew" ? "Продление скоро будет доступно" : "Оплата скоро будет доступна";

        for (const plan of plans) {
          const row = document.createElement("div");
          row.className = "plan";

          const info = document.createElement("div");
          info.className = "plan-info";
          const title = document.createElement("div");
          title.className = "plan-title";
          title.textContent = plan.title;
          const meta = document.createElement("div");
          meta.className = "plan-meta";
          const quotaText = plan.display_as_unlimited ? "Безлимит" : formatBytes(plan.quota_bytes);
          meta.textContent = `${plan.duration_days} дней · ${quotaText} · ${formatPrice(plan.price_amount_minor, plan.price_currency)}`;
          info.append(title, meta);

          const buyBtn = document.createElement("button");
          buyBtn.className = "btn-buy";
          buyBtn.setAttribute("aria-label", buyLabel);
          buyBtn.innerHTML = buyIcon;
          buyBtn.onclick = () => showToast(toastText);

          row.append(info, buyBtn);
          plansEl.appendChild(row);
        }
      }

      async function main() {
        showSkeleton();

        const [linksResult, urlResult, daysLeftResult, plansResult] = await Promise.allSettled([
          callApi("/api/me/links"),
          callApi("/api/me/subscription-url"),
          callApi("/api/me/subscription-status"),
          fetch("/api/plans").then((r) => r.json()),
        ]);

        hideSkeleton();

        if (linksResult.status === "fulfilled") {
          renderSubscriptionStatus(
            linksResult.value,
            urlResult.status === "fulfilled" ? urlResult.value.url : null,
          );
        } else {
          renderSubscriptionError();
          console.error(linksResult.reason);
        }

        if (daysLeftResult.status === "fulfilled") {
          renderDaysLeft(daysLeftResult.value.days_left);
        } else {
          console.error(daysLeftResult.reason);
        }

        if (plansResult.status === "fulfilled") {
          renderPlans(plansResult.value);
        } else {
          console.error(plansResult.reason);
        }
      }

      main();

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          main();
        }
      });
    </script>
  </body>
</html>
