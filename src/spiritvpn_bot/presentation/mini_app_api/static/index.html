<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SpiritVPN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d0d0d;
        --card-bg: #161616;
        --text: #ffffff;
        --hint: #9c9c9c;
        --accent: #e8935a;
        --border: rgba(255, 255, 255, 0.09);
        --code-bg: rgba(255, 255, 255, 0.05);
        --card-shadow: 0 24px 56px -20px rgba(0, 0, 0, 0.55);
        --button-shadow:
          0 8px 18px -8px color-mix(in srgb, var(--accent) 35%, transparent),
          0 18px 40px -16px rgba(0, 0, 0, 0.55);
        --buy-shadow:
          0 6px 14px -6px color-mix(in srgb, var(--accent) 35%, transparent),
          0 12px 26px -12px rgba(0, 0, 0, 0.55);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 1.6rem 1.25rem 2.5rem;
        background: var(--bg);
        color: var(--text);
        font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        gap: 1.6rem;
      }
      .page-heading {
        font-family: "Manrope", sans-serif;
        font-weight: 800;
        font-size: 1.9rem;
        line-height: 1.05;
        letter-spacing: -0.02em;
        margin: 0;
        text-wrap: balance;
      }
      .kicker {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin: 0 0 0.6rem;
      }
      .kicker::before {
        content: "";
        width: 10px;
        height: 2px;
        border-radius: 1px;
        background: var(--accent);
        flex-shrink: 0;
      }
      .kicker span {
        font-size: 0.69rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--hint);
      }
      .card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 1.1rem;
        box-shadow: var(--card-shadow);
      }
      .card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 0.6rem;
      }
      .card-header .kicker {
        margin: 0;
      }
      #days-left-chip {
        font-size: 0.68rem;
        font-weight: 600;
        color: var(--text);
        background: var(--code-bg);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 0.25rem 0.6rem;
      }
      #status-line {
        font-size: 1rem;
        font-weight: 600;
        margin: 0 0 0.6rem;
      }
      .status-empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 0.75rem;
        padding: 1.25rem 0.75rem 0.5rem;
      }
      .status-empty svg {
        stroke: var(--hint);
      }
      .status-empty-text {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }
      #status-empty-title {
        font-size: 1rem;
        font-weight: 600;
      }
      #status-empty-subtitle {
        font-size: 0.82rem;
        color: var(--hint);
        max-width: 260px;
      }
      #health-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 1rem;
      }
      #health-bar {
        display: flex;
        gap: 3px;
        flex-grow: 1;
      }
      #health-bar span {
        flex-grow: 1;
        height: 10px;
        border-radius: 5px;
      }
      #health-fraction {
        flex-shrink: 0;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 0.8rem;
        font-weight: 600;
      }
      #servers {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      .server {
        display: flex;
        align-items: center;
        gap: 0.6rem;
      }
      .server-info {
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .server-detail {
        font-size: 0.78rem;
        color: var(--hint);
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .dot.ready {
        background: #2f9c5f;
      }
      .dot.pending {
        background: #c9973f;
      }
      .dot.blocked,
      .dot.failed {
        background: #b8503f;
      }
      .flag {
        display: flex;
        width: 20px;
        height: 14px;
        border-radius: 2px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.18);
        flex-shrink: 0;
      }
      .flag span {
        display: block;
      }
      #toggle-servers {
        align-self: flex-start;
        border: none;
        background: transparent;
        color: var(--hint);
        font-family: inherit;
        font-size: 0.8rem;
        font-weight: 600;
        padding: 0.2rem 0;
        margin-top: 0.75rem;
        cursor: pointer;
      }
      #toggle-servers:hover {
        opacity: 0.7;
      }
      .empty-state {
        color: var(--hint);
        font-size: 0.92rem;
        padding: 0.5rem 0;
      }
      #plans {
        display: flex;
        flex-direction: column;
        gap: 0;
      }
      .plan {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.75rem 0;
      }
      .plan + .plan {
        border-top: 1px solid var(--border);
      }
      .plan-info {
        flex-grow: 1;
      }
      .plan-title {
        font-weight: 600;
        font-size: 0.95rem;
      }
      .plan-meta {
        color: var(--hint);
        font-size: 0.8rem;
        margin-top: 0.2rem;
      }
      button {
        cursor: pointer;
        font-family: inherit;
        padding: 0;
      }
      .btn-primary {
        width: 100%;
        height: 48px;
        border: none;
        border-radius: 14px;
        background: var(--text);
        color: var(--bg);
        font-size: 0.88rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        box-shadow: var(--button-shadow);
        transition: opacity 0.15s;
        margin-top: 1.1rem;
      }
      .btn-primary:hover {
        opacity: 0.86;
      }
      .btn-primary svg {
        stroke: var(--accent);
      }
      .btn-buy {
        flex-shrink: 0;
        width: 44px;
        height: 44px;
        border: none;
        border-radius: 14px;
        background: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: var(--buy-shadow);
        transition: opacity 0.15s;
      }
      .btn-buy:hover {
        opacity: 0.86;
      }
      .btn-buy svg {
        stroke: var(--accent);
      }
      #toast {
        position: fixed;
        left: 1rem;
        right: 1rem;
        bottom: 1rem;
        background: var(--text);
        color: var(--bg);
        padding: 0.7rem 1rem;
        border-radius: 10px;
        font-size: 0.88rem;
        text-align: center;
        opacity: 0;
        transform: translateY(8px);
        transition:
          opacity 0.2s,
          transform 0.2s;
        pointer-events: none;
      }
      #toast.visible {
        opacity: 1;
        transform: translateY(0);
      }
    </style>
  </head>
  <body>
    <h1 class="page-heading">Управление подпиской</h1>

    <section class="card">
      <div class="card-header">
        <p class="kicker"><span>Статус</span></p>
        <span id="days-left-chip" style="display: none"></span>
      </div>
      <p id="status-line">Загрузка…</p>
      <div id="health-row" style="display: none">
        <div id="health-bar"></div>
        <span id="health-fraction"></span>
      </div>
      <div id="servers"></div>
      <button id="toggle-servers" style="display: none"></button>
      <button id="copy-btn" class="btn-primary" style="display: none">
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"
          ></path>
          <path
            d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"
          ></path>
        </svg>
        Скопировать ссылку подписки
      </button>
      <div id="status-empty" class="status-empty" style="display: none">
        <svg
          width="40"
          height="40"
          viewBox="0 0 24 24"
          fill="none"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"></path>
        </svg>
        <div class="status-empty-text">
          <span id="status-empty-title"></span>
          <span id="status-empty-subtitle"></span>
        </div>
      </div>
    </section>

    <section class="card">
      <p class="kicker"><span id="tariffs-kicker-label">Тарифы</span></p>
      <p class="empty-state" id="plans-empty" style="display: none">
        Платные тарифы скоро появятся.
      </p>
      <div id="plans"></div>
    </section>

    <div id="toast"></div>

    <script>
      const tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();
      tg.setHeaderColor?.("#0d0d0d");
      tg.setBackgroundColor?.("#0d0d0d");

      const COLLAPSED_SERVER_LIMIT = 4;

      const STATE_COLOR = {
        READY: "#2f9c5f",
        PENDING: "#c9973f",
        BLOCKED: "#b8503f",
        FAILED: "#b8503f",
      };

      const BUY_ICON_SVG =
        '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>';
      const RENEW_ICON_SVG =
        '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path><path d="M3 21v-5h5"></path></svg>';

      const COUNTRIES = {
        NL: {
          name: "Netherlands",
          flag: { dir: "column", stripes: [["#AE1C28", 1], ["#FFFFFF", 1], ["#21468B", 1]] },
        },
        DE: {
          name: "Germany",
          flag: { dir: "column", stripes: [["#000000", 1], ["#DD0000", 1], ["#FFCE00", 1]] },
        },
        LV: {
          name: "Latvia",
          flag: { dir: "column", stripes: [["#9E1B32", 2], ["#FFFFFF", 1], ["#9E1B32", 2]] },
        },
        RO: {
          name: "Romania",
          flag: { dir: "row", stripes: [["#002B7F", 1], ["#FCD116", 1], ["#CE1126", 1]] },
        },
        RU: {
          name: "Russia",
          flag: { dir: "column", stripes: [["#FFFFFF", 1], ["#0039A6", 1], ["#D52B1E", 1]] },
        },
      };

      // Фоллбэк на переходный период для нод, ещё не переименованных под
      // "[код страны] [имя] [номер]" — сопоставление по старому свободному
      // имени (может быть городом, как "amsterdam", либо уже страной, как
      // "russia"). Удалить, когда все ноды в манифесте переедут на новый
      // формат.
      const COUNTRY_CODE_BY_LEGACY_NAME = {
        amsterdam: "NL",
        frankfurt: "DE",
        riga: "LV",
        romania: "RO",
        russia: "RU",
      };

      const COUNTRY_CODE_RE = /^[A-Z]{2}$/;

      function splitCountryCode(side) {
        const [first, ...rest] = side.split(" ");
        if (COUNTRY_CODE_RE.test(first) && COUNTRIES[first]) {
          return { code: first, rest: rest.join(" ") || side };
        }
        return { code: null, rest: side };
      }

      // Разбирает одну сторону label ("NL Amsterdam 1" либо легаси
      // "Amsterdam") в { flag, name, detail }. name — название страны, если
      // код страны опознан (иначе исходный текст стороны как есть); detail —
      // город/номер ноды, только когда страна опознана и есть что показать
      // отдельной строкой — иначе null (не дублировать name). Без detail две
      // ноды в одной стране неотличимы друг от друга в списке.
      function countryInfoForSide(rawSide) {
        const { code, rest } = splitCountryCode(rawSide);
        const resolvedCode = code ?? COUNTRY_CODE_BY_LEGACY_NAME[rawSide.toLowerCase()];
        const country = resolvedCode ? COUNTRIES[resolvedCode] : undefined;
        return {
          flag: country?.flag ?? null,
          name: country?.name ?? rest,
          detail: country && rest !== country.name ? rest : null,
        };
      }

      // Возвращает { flagDef, displayLabel, detailLabel }. displayLabel —
      // название страны по каждой стороне BRIDGE отдельно (раз рядом уже
      // стоит флаг, дублировать смысл названием города незачем). detailLabel
      // — город/номер ноды второй строкой под названием страны; null, если
      // отличать нечем. Сторона, для которой страна не опознана, показывается
      // как есть, без выдумывания.
      function resolveLink(label) {
        if (!label) {
          return { flagDef: null, displayLabel: null, detailLabel: null };
        }
        const infos = label.split("→").map((side) => countryInfoForSide(side.trim()));
        const detailLabel = infos.some((info) => info.detail)
          ? infos.map((info) => info.detail ?? info.name).join(" → ")
          : null;
        return {
          flagDef: infos[0].flag,
          displayLabel: infos.map((info) => info.name).join(" → "),
          detailLabel,
        };
      }

      function buildFlagIcon(flagDef) {
        if (!flagDef) {
          return null;
        }
        const flag = document.createElement("span");
        flag.className = "flag";
        flag.style.flexDirection = flagDef.dir;
        for (const [color, weight] of flagDef.stripes) {
          const stripe = document.createElement("span");
          stripe.style.background = color;
          stripe.style.flexGrow = String(weight);
          flag.appendChild(stripe);
        }
        return flag;
      }

      let allLinks = [];
      let serversExpanded = false;
      // "buy" — клиент никогда не получал доступ (первая покупка);
      // "renew" — доступ был хоть раз, даже если сейчас не активен
      // (истёк/заблокирован) — тарифы предлагаем как продление, не как
      // покупку с нуля. Выставляется в loadSubscriptionStatus(), читается в
      // loadPlans() — main() вызывает их строго в этом порядке.
      let tariffsMode = "buy";

      function showToast(text) {
        const toast = document.getElementById("toast");
        toast.textContent = text;
        toast.classList.add("visible");
        setTimeout(() => toast.classList.remove("visible"), 2000);
      }

      async function callApi(path) {
        const res = await fetch(path, {
          headers: { "X-Telegram-Init-Data": tg.initData },
        });
        if (!res.ok) {
          throw new Error(`${path} -> ${res.status}`);
        }
        return res.json();
      }

      function formatBytes(bytes) {
        const gib = bytes / 1024 ** 3;
        return Number.isInteger(gib) ? `${gib} ГБ` : `${gib.toFixed(1)} ГБ`;
      }

      function formatPrice(amountMinor, currency) {
        const amount = (amountMinor / 100).toLocaleString("ru-RU");
        return `${amount} ${currency}`;
      }

      function buildServerRow(link, index) {
        const row = document.createElement("div");
        row.className = "server";

        const dot = document.createElement("span");
        dot.className = `dot ${link.state.toLowerCase()}`;
        row.appendChild(dot);

        const { flagDef, displayLabel, detailLabel } = resolveLink(link.label);
        const flagIcon = buildFlagIcon(flagDef);
        if (flagIcon) {
          row.appendChild(flagIcon);
        }

        const info = document.createElement("div");
        info.className = "server-info";

        const name = document.createElement("span");
        name.textContent = displayLabel ?? `Сервер ${index + 1}`;
        info.appendChild(name);

        if (detailLabel) {
          const detail = document.createElement("span");
          detail.className = "server-detail";
          detail.textContent = detailLabel;
          info.appendChild(detail);
        }

        row.appendChild(info);

        return row;
      }

      function renderHealthBar() {
        const barEl = document.getElementById("health-bar");
        const fractionEl = document.getElementById("health-fraction");
        barEl.innerHTML = "";
        for (const link of allLinks) {
          const color = STATE_COLOR[link.state] ?? STATE_COLOR.FAILED;
          const segment = document.createElement("span");
          segment.style.background = color;
          segment.style.boxShadow = `0 0 10px ${color}66`;
          barEl.appendChild(segment);
        }
        const readyCount = allLinks.filter((l) => l.state === "READY").length;
        fractionEl.textContent = `${readyCount}/${allLinks.length}`;
      }

      function renderServers() {
        const serversEl = document.getElementById("servers");
        const toggleBtn = document.getElementById("toggle-servers");
        serversEl.innerHTML = "";

        const visible = serversExpanded
          ? allLinks
          : allLinks.slice(0, COLLAPSED_SERVER_LIMIT);
        visible.forEach((link, index) => serversEl.appendChild(buildServerRow(link, index)));

        if (allLinks.length > COLLAPSED_SERVER_LIMIT) {
          toggleBtn.style.display = "block";
          toggleBtn.textContent = serversExpanded
            ? "Свернуть"
            : `Показать ещё ${allLinks.length - COLLAPSED_SERVER_LIMIT}`;
        } else {
          toggleBtn.style.display = "none";
        }
      }

      document.getElementById("toggle-servers").onclick = () => {
        serversExpanded = !serversExpanded;
        renderServers();
      };

      async function loadDaysLeft() {
        try {
          const { days_left } = await callApi("/api/me/subscription-status");
          if (days_left === null) {
            return;
          }
          const chip = document.getElementById("days-left-chip");
          chip.textContent = `${days_left} дней осталось`;
          chip.style.display = "inline-block";
        } catch (err) {
          console.error(err);
        }
      }

      async function loadSubscriptionStatus() {
        const statusEl = document.getElementById("status-line");
        const healthRowEl = document.getElementById("health-row");
        const serversEl = document.getElementById("servers");
        const toggleBtn = document.getElementById("toggle-servers");
        const copyBtn = document.getElementById("copy-btn");
        const emptyEl = document.getElementById("status-empty");
        const emptyTitleEl = document.getElementById("status-empty-title");
        const emptySubtitleEl = document.getElementById("status-empty-subtitle");
        const tariffsKickerEl = document.getElementById("tariffs-kicker-label");

        allLinks = await callApi("/api/me/links");

        const hasEverHadAccess = allLinks.length > 0;
        const hasActiveOrPending = allLinks.some(
          (l) => l.state === "READY" || l.state === "PENDING",
        );

        tariffsMode = hasEverHadAccess ? "renew" : "buy";
        tariffsKickerEl.textContent = tariffsMode === "renew" ? "Тарифы — продление" : "Тарифы";

        if (!hasActiveOrPending) {
          statusEl.style.display = "none";
          healthRowEl.style.display = "none";
          serversEl.style.display = "none";
          toggleBtn.style.display = "none";
          copyBtn.style.display = "none";
          emptyEl.style.display = "flex";
          emptyTitleEl.textContent = hasEverHadAccess
            ? "Подписка закончилась"
            : "Активной подписки нет";
          emptySubtitleEl.textContent = hasEverHadAccess
            ? "Продлите тариф ниже, чтобы восстановить доступ"
            : "Оформите тариф ниже, чтобы получить доступ к серверам";
          return;
        }

        emptyEl.style.display = "none";
        statusEl.style.display = "block";
        serversEl.style.display = "flex";

        const ready = allLinks.filter((l) => l.state === "READY").length;
        statusEl.textContent = `${ready} из ${allLinks.length} серверов активны`;
        healthRowEl.style.display = "flex";
        renderHealthBar();
        renderServers();

        const { url } = await callApi("/api/me/subscription-url");
        copyBtn.style.display = "flex";
        copyBtn.onclick = async () => {
          await navigator.clipboard.writeText(url);
          tg.HapticFeedback?.notificationOccurred("success");
          const label = copyBtn.lastChild;
          label.textContent = "Скопировано";
          setTimeout(() => {
            label.textContent = "Скопировать ссылку подписки";
          }, 1500);
        };
      }

      async function loadPlans() {
        const plansEl = document.getElementById("plans");
        const emptyEl = document.getElementById("plans-empty");

        const plans = await fetch("/api/plans").then((r) => r.json());

        plansEl.innerHTML = "";
        emptyEl.style.display = "none";

        if (plans.length === 0) {
          emptyEl.style.display = "block";
          return;
        }

        const buyLabel = tariffsMode === "renew" ? "Продлить" : "Купить";
        const buyIcon = tariffsMode === "renew" ? RENEW_ICON_SVG : BUY_ICON_SVG;
        const toastText =
          tariffsMode === "renew" ? "Продление скоро будет доступно" : "Оплата скоро будет доступна";

        for (const plan of plans) {
          const row = document.createElement("div");
          row.className = "plan";

          const info = document.createElement("div");
          info.className = "plan-info";
          const title = document.createElement("div");
          title.className = "plan-title";
          title.textContent = plan.title;
          const meta = document.createElement("div");
          meta.className = "plan-meta";
          const quotaText = plan.display_as_unlimited ? "Безлимит" : formatBytes(plan.quota_bytes);
          meta.textContent = `${plan.duration_days} дней · ${quotaText} · ${formatPrice(plan.price_amount_minor, plan.price_currency)}`;
          info.append(title, meta);

          const buyBtn = document.createElement("button");
          buyBtn.className = "btn-buy";
          buyBtn.setAttribute("aria-label", buyLabel);
          buyBtn.innerHTML = buyIcon;
          buyBtn.onclick = () => showToast(toastText);

          row.append(info, buyBtn);
          plansEl.appendChild(row);
        }
      }

      async function main() {
        try {
          await loadSubscriptionStatus();
        } catch (err) {
          const statusEl = document.getElementById("status-line");
          statusEl.style.display = "block";
          statusEl.textContent = "Не удалось загрузить статус подписки.";
          document.getElementById("status-empty").style.display = "none";
          console.error(err);
        }

        try {
          await loadDaysLeft();
        } catch (err) {
          console.error(err);
        }

        try {
          await loadPlans();
        } catch (err) {
          console.error(err);
        }
      }

      main();

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          main();
        }
      });
    </script>
  </body>
</html>
