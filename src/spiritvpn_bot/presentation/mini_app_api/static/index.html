<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SpiritVPN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap"
    />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --text: #15161a;
        --hint: #75787f;
        --accent: #2f8a82;
        --accent-text: #ffffff;
        --border: rgba(20, 20, 22, 0.08);
        --accent-shadow: rgba(47, 138, 130, 0.3);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #161717;
          --text: #f3f3f2;
          --hint: #8c8f94;
          --border: rgba(255, 255, 255, 0.1);
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 1.5rem 1.25rem 2.5rem;
        background: var(--bg);
        color: var(--text);
        font-family: "Onest", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        gap: 1.75rem;
      }
      .subtitle {
        font-size: 0.82rem;
        color: var(--hint);
        margin: 0;
      }
      .kicker {
        font-size: 0.69rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--hint);
        margin: 0 0 0.75rem;
      }
      .card {
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 1.1rem;
      }
      #status-line {
        font-size: 1rem;
        font-weight: 600;
        margin: 0 0 1.1rem;
      }
      #servers {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        margin-bottom: 1.1rem;
      }
      .server {
        display: flex;
        align-items: center;
        gap: 0.6rem;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .dot.ready {
        background: #2f9c5f;
      }
      .dot.pending {
        background: #c9973f;
      }
      .dot.blocked,
      .dot.failed {
        background: #b8503f;
      }
      .empty-state {
        color: var(--hint);
        font-size: 0.92rem;
        padding: 0.5rem 0;
      }
      #plans {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      .plan {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 0.9rem 1rem;
      }
      .plan-title {
        font-weight: 600;
        font-size: 0.95rem;
      }
      .plan-meta {
        color: var(--hint);
        font-size: 0.8rem;
        margin-top: 0.2rem;
      }
      .plan-info {
        flex-grow: 1;
      }
      .plan button {
        flex-shrink: 0;
        width: auto;
        margin: 0;
        border-radius: 999px;
        padding: 0.62rem 1.1rem;
        font-size: 0.85rem;
      }
      button {
        width: 100%;
        padding: 0.85rem;
        border: none;
        border-radius: 999px;
        background: var(--accent);
        color: var(--accent-text);
        font-family: inherit;
        font-size: 0.92rem;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.15s;
      }
      button:hover {
        opacity: 0.88;
      }
      button:disabled {
        opacity: 0.5;
      }
      #copy-btn {
        box-shadow: 0 8px 20px -8px var(--accent-shadow);
      }
      #toast {
        position: fixed;
        left: 1rem;
        right: 1rem;
        bottom: 1rem;
        background: var(--text);
        color: var(--bg);
        padding: 0.7rem 1rem;
        border-radius: 10px;
        font-size: 0.88rem;
        text-align: center;
        opacity: 0;
        transform: translateY(8px);
        transition:
          opacity 0.2s,
          transform 0.2s;
        pointer-events: none;
      }
      #toast.visible {
        opacity: 1;
        transform: translateY(0);
      }
    </style>
  </head>
  <body>
    <p class="subtitle">Управление подпиской</p>

    <section class="card">
      <p class="kicker">Статус</p>
      <p id="status-line">Загрузка…</p>
      <div id="servers"></div>
      <button id="copy-btn" style="display: none">Скопировать ссылку подписки</button>
    </section>

    <section>
      <p class="kicker">Тарифы</p>
      <p class="empty-state" id="plans-empty" style="display: none">
        Платные тарифы скоро появятся.
      </p>
      <div id="plans"></div>
    </section>

    <div id="toast"></div>

    <script>
      const tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();

      const DEBUG_SHOW_LINK_DETAILS = true;

      const STATE_LABEL = {
        READY: "готов",
        PENDING: "активируется",
        BLOCKED: "заблокирован",
        FAILED: "ошибка",
      };

      function showToast(text) {
        const toast = document.getElementById("toast");
        toast.textContent = text;
        toast.classList.add("visible");
        setTimeout(() => toast.classList.remove("visible"), 2000);
      }

      async function callApi(path) {
        const res = await fetch(path, {
          headers: { "X-Telegram-Init-Data": tg.initData },
        });
        if (!res.ok) {
          throw new Error(`${path} -> ${res.status}`);
        }
        return res.json();
      }

      function formatBytes(bytes) {
        const gib = bytes / 1024 ** 3;
        return Number.isInteger(gib) ? `${gib} ГБ` : `${gib.toFixed(1)} ГБ`;
      }

      function formatPrice(amountMinor, currency) {
        const amount = (amountMinor / 100).toLocaleString("ru-RU");
        return `${amount} ${currency}`;
      }

      async function loadSubscriptionStatus() {
        const statusEl = document.getElementById("status-line");
        const serversEl = document.getElementById("servers");
        const copyBtn = document.getElementById("copy-btn");

        const links = await callApi("/api/me/links");

        if (links.length === 0) {
          statusEl.textContent = "Активной подписки нет — выберите тариф ниже.";
          return;
        }

        const ready = links.filter((l) => l.state === "READY").length;
        statusEl.textContent = `Готово серверов: ${ready} из ${links.length}`;

        links.forEach((link, index) => {
          const row = document.createElement("div");
          row.className = "server";
          const dot = document.createElement("span");
          dot.className = `dot ${link.state.toLowerCase()}`;
          const label = document.createElement("span");
          const name = link.label ?? `Сервер ${index + 1}`;
          let debugSuffix = "";
          if (DEBUG_SHOW_LINK_DETAILS) {
            const sniPart = link.debug_sni ? `, sni=${link.debug_sni}` : "";
            debugSuffix = ` [${link.kind}${sniPart}]`;
          }
          label.textContent = `${name} — ${STATE_LABEL[link.state] ?? link.state}${debugSuffix}`;
          row.append(dot, label);
          serversEl.appendChild(row);
        });

        const { url } = await callApi("/api/me/subscription-url");
        copyBtn.style.display = "block";
        copyBtn.onclick = async () => {
          await navigator.clipboard.writeText(url);
          tg.HapticFeedback?.notificationOccurred("success");
          copyBtn.textContent = "Скопировано";
          setTimeout(() => {
            copyBtn.textContent = "Скопировать ссылку подписки";
          }, 1500);
        };
      }

      async function loadPlans() {
        const plansEl = document.getElementById("plans");
        const emptyEl = document.getElementById("plans-empty");

        const plans = await fetch("/api/plans").then((r) => r.json());

        if (plans.length === 0) {
          emptyEl.style.display = "block";
          return;
        }

        for (const plan of plans) {
          const row = document.createElement("div");
          row.className = "plan";

          const info = document.createElement("div");
          info.className = "plan-info";
          const title = document.createElement("div");
          title.className = "plan-title";
          title.textContent = plan.title;
          const meta = document.createElement("div");
          meta.className = "plan-meta";
          const quotaText = plan.display_as_unlimited ? "Безлимит" : formatBytes(plan.quota_bytes);
          meta.textContent = `${plan.duration_days} дней · ${quotaText} · ${formatPrice(plan.price_amount_minor, plan.price_currency)}`;
          info.append(title, meta);

          const buyBtn = document.createElement("button");
          buyBtn.textContent = "Купить";
          buyBtn.onclick = () => showToast("Оплата скоро будет доступна");

          row.append(info, buyBtn);
          plansEl.appendChild(row);
        }
      }

      async function main() {
        try {
          await loadSubscriptionStatus();
        } catch (err) {
          document.getElementById("status-line").textContent = "Не удалось загрузить статус подписки.";
          console.error(err);
        }

        try {
          await loadPlans();
        } catch (err) {
          console.error(err);
        }
      }

      main();
    </script>
  </body>
</html>
